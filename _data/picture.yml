# jekyll_picture_tag presets (v2 schema) — https://rbuchberger.github.io/jekyll_picture_tag/
media_queries:
  mobile: "max-width: 700px"

presets:
  # Mosaic tiles on the home page
  # Tiles are square or span two rows and object-fit: cover, so a landscape
  # image has to fill the tile's height, not its width. The browser picks a
  # candidate by width alone, so the size hint overstates the tile width to
  # leave enough pixels for the crop.
  thumb:
    widths: [480, 720, 1000, 1400, 2000]
    formats: [webp, original]
    quality: 85
    # jekyll_picture_tag defaults WebP to quality 50 and that default wins
    # over `quality`, so every preset has to set it explicitly.
    format_quality:
      webp: 85
    sizes:
      mobile: "100vw"
    size: "40vw"
    attributes:
      img: 'loading="lazy" decoding="async"'

  # Expanded panel gallery + project pages
  gallery:
    widths: [600, 1000, 1600]
    formats: [webp, original]
    quality: 80
    format_quality:
      webp: 80
    sizes:
      mobile: "90vw"
    size: "60vw"
    # The carousel measures slide widths before the images load, so the
    # intrinsic aspect ratio has to be in the markup.
    dimension_attributes: true
    attributes:
      img: 'loading="lazy" decoding="async"'

  # Full-viewport hero slides
  hero:
    widths: [800, 1400, 2200]
    formats: [webp, original]
    quality: 75
    format_quality:
      webp: 75
    size: "100vw"
